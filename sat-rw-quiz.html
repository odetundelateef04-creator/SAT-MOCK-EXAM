{passage:`More than 60% of journeys in Mexico City occur via public transit, but simply reproducing a feature of the city's transit system—e.g., its low fares—is unlikely to induce a significant increase in another city's transit ridership. As Erick Guerra et al. have shown, transportation mode choice in urban areas of Mexico is the product of a complex mix of factors, including population density, the spatial distribution of jobs, and demographic characteristics of individuals. System features do affect ridership, of course, but [underlined:] there is an irreducibly contextual dimension of transportation mode choice.`,

{passage:`Changes to vegetation cover and other human activities influence carbon and nitrogen levels in soil, though how deep these effects extend is unclear. Hypothesizing that differences in land use lead to differences in carbon and nitrogen levels that are not restricted to the topsoil layer (0–30 cm deep), Chukwuebuka Okolo and colleagues sampled soils across multiple land-use types (e.g., grazing land, cropland, forest) within each of several Ethiopian locations. They found, though, that across land-use types, carbon and nitrogen decreased to comparably low levels beyond depths of 30 cm.`,

/* ---------- RENDER ---------- */
const root = document.getElementById('quizRoot');
const letters = ['A','B','C','D'];
let totalQ = module1.length + module2.length;

function renderModule(moduleArr, moduleLabel, moduleIdx){
  const title = document.createElement('div');
  title.className = 'module-title';
  title.textContent = moduleLabel;
  root.appendChild(title);

  moduleArr.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.module = moduleIdx;
    card.dataset.qindex = i;
    card.dataset.answer = item.a;

    const num = document.createElement('div');
    num.className = 'qnum';
    num.textContent = `Q${i+1}`;
    card.appendChild(num);

    if(item.passage){
      const p = document.createElement('div');
      p.className = 'passage';
      p.textContent = item.passage;
      card.appendChild(p);
    }

    const qt = document.createElement('div');
    qt.className = 'qtext';
    qt.textContent = item.q;
    card.appendChild(qt);

    const choices = document.createElement('div');
    choices.className = 'choices';
    item.c.forEach((choiceText, ci) => {
      const lab = document.createElement('label');
      lab.className = 'choice';
      lab.dataset.ci = ci;
      const inp = document.createElement('input');
      inp.type = 'radio';
      inp.name = `m${moduleIdx}q${i}`;
      inp.value = ci;
      inp.addEventListener('change', updateProgress);
      const span = document.createElement('span');
      span.className = 'lettxt';
      span.textContent = `${letters[ci]}) ${choiceText}`;
      lab.appendChild(inp);
      lab.appendChild(span);
      choices.appendChild(lab);
    });
    card.appendChild(choices);

    const tag = document.createElement('div');
    tag.className = 'result-tag';
    card.appendChild(tag);

    root.appendChild(card);
  });
}

renderModule(module1, 'Module 1 — Reading and Writing (33 questions)', 0);
renderModule(module2, 'Module 2 — Reading and Writing (33 questions)', 1);

function updateProgress(){
  const answered = document.querySelectorAll('.choices input[type=radio]:checked').length;
  document.getElementById('progressLabel').textContent = `${answered} / ${totalQ} answered`;
}

function submitQuiz(){
  const cards = document.querySelectorAll('.card');
  let correctCount = 0;
  let m1correct = 0, m2correct = 0;
  let answeredCount = 0;

  cards.forEach(card => {
    const modIdx = parseInt(card.dataset.module, 10);
    const correctIdx = parseInt(card.dataset.answer, 10);
    const checked = card.querySelector('input[type=radio]:checked');
    const labels = card.querySelectorAll('.choice');
    labels.forEach(l => l.classList.add('locked'));

    let userIdx = checked ? parseInt(checked.value, 10) : null;
    if(userIdx !== null) answeredCount++;

    const tag = card.querySelector('.result-tag');
    tag.classList.add('show');

    if(userIdx === correctIdx){
      correctCount++;
      if(modIdx === 0) m1correct++; else m2correct++;
      labels[correctIdx].classList.add('correct-ans');
      tag.textContent = '✓ Correct';
      tag.classList.add('correct');
    } else {
      labels[correctIdx].classList.add('correct-ans');
      if(userIdx !== null){
        labels[userIdx].classList.add('wrong-ans');
      }
      tag.textContent = userIdx === null ? `✗ Not answered — correct answer: ${letters[correctIdx]}` : `✗ Incorrect — correct answer: ${letters[correctIdx]}`;
      tag.classList.add('wrong');
    }

    // disable further input changes
    card.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);
  });

  const pct = Math.round((correctCount/totalQ)*1000)/10;
  document.getElementById('scoreBig').textContent = `${correctCount} / ${totalQ}`;
  document.getElementById('scorePct').textContent = `${pct}% correct`;
  document.getElementById('m1score').textContent = `${m1correct}/33`;
  document.getElementById('m2score').textContent = `${m2correct}/33`;
  document.getElementById('scoreCard').classList.add('show');
  document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Submitted';
  document.getElementById('progressLabel').textContent = `${answeredCount} / ${totalQ} answered — Test submitted`;
}
</script>
</body>
</html>
